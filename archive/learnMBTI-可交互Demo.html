<body>

<!-- 屏1 首页 -->
<section id="home" class="screen home">
  <div class="brand"><span class="dot"></span>learnMBTI</div>

  <div class="btn-wrap"><a class="btn" onclick="startQuiz()">开始测试</a></div>

</section>

<script>

/* ===== 数据：建议（按维度胜出极生成） ===== */
var ADVICE = {
  start:  { t: "陪玩策略 · 少讲，多陪做", d: "和 TA 一起动手试错，让 TA 自己撞出答案，学到的东西会牢得多。" },
  plan:   { t: "陪玩策略 · 先给全景图", d: "动手前先讲清楚整体安排和步骤，TA 会更安心，学起来更稳。" },
  alone:  { t: "环境支持 · 给 TA 一块安静领地", d: "别频繁打断，也别在旁边\u201c指导\u201d，安静守着就好。" },
  gang:   { t: "环境支持 · 给 TA 组队机会", d: "找小伙伴或陪 TA 一起学，有人陪着 TA 才有劲、学得进。" },
  work:   { t: "验收方式 · 让 TA 做出成品", d: "问\u201c你学会了什么\u201d不如说\u201c做个东西给我看\u201d。" },
  clear:  { t: "验收方式 · 问 TA 弄懂了吗", d: "TA 弄明白就真学会了，别硬要 TA 交作品，那会打击 TA。" }
};

/* ===== 判定算法 ===== */
var answers = [];
function startQuiz() {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  renderQuestion(0);
}
function renderQuestion(i) {
  var q = QUESTIONS[i];
  document.getElementById("qNow").textContent = i + 1;
  document.getElementById("qTotal").textContent = QUESTIONS.length;
  document.getElementById("qBar").style.width = Math.round((i + 1) / QUESTIONS.length * 100) + "%";
  document.getElementById("qDim").textContent = q.dim;
  document.getElementById("qText").textContent = q.text;
  var box = document.getElementById("qOpts");
  box.innerHTML = "";
  var opts = [q.a, q.b];
  var labels = ["A", "B"];
  for (var k = 0; k < 2; k++) {
    (function (idx) {
      var el = document.createElement("div");
      el.className = "opt";
      el.innerHTML = '<div class="letter">' + labels[idx] + '</div>' + opts[idx].label;
      el.onclick = function () {
        answers[i] = opts[idx].pole;
        if (i + 1 < QUESTIONS.length) { renderQuestion(i + 1); }
        else { showResult(); }
      };
      box.appendChild(el);
    })(k);
  }
}
function showResult() {
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  // 四维计分
  var dims = ["start", "big", "alone", "work"]; // 每个维度的第一极
  var revs = { start: "plan", big: "detail", alone: "gang", work: "clear" };
  var scores = {};
  var counts = {};
  for (var i = 0; i < QUESTIONS.length; i++) {
    var d = QUESTIONS[i].dim;
    if (!counts[d]) { counts[d] = { start: 0, plan: 0, big: 0, detail: 0, alone: 0, gang: 0, work: 0, clear: 0 }; }
    counts[d][answers[i]]++;
  }
  function pick(dim, p1, p2) {
    var c1 = counts[dim][p1], c2 = counts[dim][p2];
    var pct = Math.round(c1 / (c1 + c2) * 100);
    var win = c1 >= c2 ? p1 : p2;
    var edge = pct >= 40 && pct <= 60; // 边缘兜底：占比在 40-60% 视为待观察
    return { pct: pct, win: win, edge: edge };
  }
  var r = {
    start: pick("起手式", "start", "plan"),
    big: pick("信息口味", "big", "detail"),
    alone: pick("学习搭子", "alone", "gang"),
    work: pick("验收执念", "work", "clear")
  };
  var code = (r.start.win === "start" ? "A" : "P") + (r.big.win === "big" ? "F" : "D") + (r.alone.win === "alone" ? "L" : "G") + (r.work.win === "work" ? "W" : "T");
  renderResult(code, r);
}
function renderResult(code, r) {
  var t = TYPES[code.slice(0, 2) + "_" + code.slice(2)];
  document.getElementById("rCode").textContent = code;
  document.getElementById("rName").textContent = t.name;
  var t1 = r.start.edge ? "待观察" : (r.start.win === "start" ? "先动手派" : "先规划派");
  var t2 = r.big.edge ? "待观察" : (r.big.win === "big" ? "看大局派" : "抠细节派");
  var t3 = r.alone.edge ? "待观察" : (r.alone.win === "alone" ? "独行侠" : "搭子狂");
  var t4 = r.work.edge ? "待观察" : (r.work.win === "work" ? "作品党" : "通透党");
  document.getElementById("rTraits").textContent = t1 + " · " + t2 + " · " + t3 + " · " + t4;
  document.getElementById("rSummary").textContent = t.persona;
  var axes = document.getElementById("rAxes");
  axes.innerHTML = "";
  var rows = [
    { l: "先动手派 " + r.start.pct + "%", r: "先规划派 " + (100 - r.start.pct) + "%", w: r.start.pct, edge: r.start.edge },
    { l: "看大局派 " + r.big.pct + "%", r: "抠细节派 " + (100 - r.big.pct) + "%", w: r.big.pct, edge: r.big.edge },
    { l: "独行侠 " + r.alone.pct + "%", r: "搭子狂 " + (100 - r.alone.pct) + "%", w: r.alone.pct, edge: r.alone.edge },
    { l: "作品党 " + r.work.pct + "%", r: "通透党 " + (100 - r.work.pct) + "%", w: r.work.pct, edge: r.work.edge }
  ];
  for (var i = 0; i < rows.length; i++) {
    var row = document.createElement("div");
    row.className = "axis-row";
    row.innerHTML = '<div class="axis-label"><span class="left">' + rows[i].l + (rows[i].edge ? '<span class="edge-tag">待观察</span>' : '') + '</span><span class="right">' + rows[i].r + '</span></div>' +
      '<div class="axis-track"><div class="axis-fill' + (rows[i].edge ? ' edge' : '') + '" style="width:' + rows[i].w + '%"></div></div>';
    axes.appendChild(row);
  }
  var adv = document.getElementById("rAdvice");
  adv.innerHTML = "";
  var pickData = [
    { d: r.start, k: "start" },
    { d: r.alone, k: "alone" },
    { d: r.work, k: "work" }
  ];
  var picks = [];
  for (var pd = 0; pd < pickData.length; pd++) {
    if (!pickData[pd].d.edge) { picks.push(pickData[pd].d.win); }
  }
  var banner = document.getElementById("rEdgeBanner");
  var edgeCount = (r.start.edge ? 1 : 0) + (r.big.edge ? 1 : 0) + (r.alone.edge ? 1 : 0) + (r.work.edge ? 1 : 0);
  if (edgeCount > 0) {
    banner.textContent = "检测到 " + edgeCount + " 个维度还不够明显：建议日常多观察孩子的表现后再测一次，结果会更准。边缘维度已用橙色标注，先不给出该维度的建议。";
    banner.classList.remove("hidden");
  } else {
    banner.classList.add("hidden");
  }
  for (var j = 0; j < picks.length; j++) {
    var a = ADVICE[picks[j]];
    var item = document.createElement("div");
    item.className = "advice";
    item.innerHTML = '<div class="icon">' + (j + 1) + '</div><div><h4>' + a.t + '</h4><p>' + a.d + '</p></div>';
    adv.appendChild(item);
  }
}
